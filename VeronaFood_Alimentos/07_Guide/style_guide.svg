<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800"><title>VeronaFood Consultoria de Alimentos</title><path fill="#F5EDE4" d="M0 0H1200V1800H0Z"/><text x="80" y="140" fill="#6E0F2A" font-family="Segoe UI, sans-serif" font-size="70" letter-spacing="0">VeronaFood</text><text x="84" y="200" fill="#6E0F2A" font-family="Segoe UI, sans-serif" font-size="19" letter-spacing="3">GUIA DE IDENTIDADE VISUAL</text><path d="M80 270h1040" stroke="#B59B8A" stroke-width="1"/><text x="80" y="300" fill="#6E0F2A" font-family="Segoe UI, sans-serif" font-size="23" letter-spacing="0">01 / Assinatura</text><text x="80" y="348" fill="#6E0F2A" font-family="Segoe UI, sans-serif" font-size="19" letter-spacing="0">Arco aberto afilado, talheres preenchidos e folha dupla na base.</text><text x="80" y="382" fill="#6E0F2A" font-family="Segoe UI, sans-serif" font-size="19" letter-spacing="0">Verona champagne; Food borgonha. CONSULTORIA DE ALIMENTOS abaixo do nome.</text><path d="M80 457h1040" stroke="#B59B8A" stroke-width="1"/><text x="80" y="487" fill="#6E0F2A" font-family="Segoe UI, sans-serif" font-size="23" letter-spacing="0">02 / Fundos e contraste</text><text x="80" y="535" fill="#6E0F2A" font-family="Segoe UI, sans-serif" font-size="19" letter-spacing="0">Assinatura bicolor: fundos escuros ou taupe; em fundo claro, versão vinho.</text><text x="80" y="569" fill="#6E0F2A" font-family="Segoe UI, sans-serif" font-size="19" letter-spacing="0">Em fundo vinho/borgonha, usar assinatura monocromática champagne.</text><path d="M80 644h1040" stroke="#B59B8A" stroke-width="1"/><text x="80" y="674" fill="#6E0F2A" font-family="Segoe UI, sans-serif" font-size="23" letter-spacing="0">03 / Área de proteção</text><text x="80" y="722" fill="#6E0F2A" font-family="Segoe UI, sans-serif" font-size="19" letter-spacing="0">Reservar ao redor da marca uma margem igual a 1/4 do diâmetro do ícone.</text><text x="80" y="756" fill="#6E0F2A" font-family="Segoe UI, sans-serif" font-size="19" letter-spacing="0">Largura mínima: horizontal 180 px / 38 mm; empilhada 140 px / 30 mm.</text><path d="M80 831h1040" stroke="#B59B8A" stroke-width="1"/><text x="80" y="861" fill="#6E0F2A" font-family="Segoe UI, sans-serif" font-size="23" letter-spacing="0">04 / Tipografia</text><text x="80" y="909" fill="#6E0F2A" font-family="Segoe UI, sans-serif" font-size="19" letter-spacing="0">Assinatura: Arial Bold em curvas; alternativa provisória à Montserrat da referência.</text><text x="80" y="943" fill="#6E0F2A" font-family="Segoe UI, sans-serif" font-size="19" letter-spacing="0">Referência tipográfica: Montserrat e Inter. Fontes não incluídas.</text><path d="M80 1018h1040" stroke="#B59B8A" stroke-width="1"/><text x="80" y="1048" fill="#6E0F2A" font-family="Segoe UI, sans-serif" font-size="23" letter-spacing="0">05 / Integridade</text><text x="80" y="1096" fill="#6E0F2A" font-family="Segoe UI, sans-serif" font-size="19" letter-spacing="0">Não distorcer, girar, adicionar sombras ou alterar as cores do símbolo.</text><text x="80" y="1130" fill="#6E0F2A" font-family="Segoe UI, sans-serif" font-size="19" letter-spacing="0">Não usar monograma V ou acrescentar frases à assinatura.</text><path d="M80 1205h1040" stroke="#B59B8A" stroke-width="1"/><text x="80" y="1235" fill="#6E0F2A" font-family="Segoe UI, sans-serif" font-size="23" letter-spacing="0">06 / Impressão e arquivos</text><text x="80" y="1283" fill="#6E0F2A" font-family="Segoe UI, sans-serif" font-size="19" letter-spacing="0">Cartão: corte 90 × 50 mm; sangria de 3 mm; margem interna de 3 mm.</text><text x="80" y="1317" fill="#6E0F2A" font-family="Segoe UI, sans-serif" font-size="19" letter-spacing="0">PNG: 1134 × 662 px a 300 ppi. Cor RGB; conversão ICC pela gráfica.</text><rect x="80" y="1450" width="190" height="115" fill="#6E0F2A" stroke="#B59B8A"/><text x="80" y="1600" fill="#6E0F2A" font-family="Segoe UI, sans-serif" font-size="19" letter-spacing="0">#6E0F2A</text><rect x="288" y="1450" width="190" height="115" fill="#8B1E3F" stroke="#B59B8A"/><text x="288" y="1600" fill="#6E0F2A" font-family="Segoe UI, sans-serif" font-size="19" letter-spacing="0">#8B1E3F</text><rect x="496" y="1450" width="190" height="115" fill="#B86A7A" stroke="#B59B8A"/><text x="496" y="1600" fill="#6E0F2A" font-family="Segoe UI, sans-serif" font-size="19" letter-spacing="0">#B86A7A</text><rect x="704" y="1450" width="190" height="115" fill="#F5EDE4" stroke="#B59B8A"/><text x="704" y="1600" fill="#6E0F2A" font-family="Segoe UI, sans-serif" font-size="19" letter-spacing="0">#F5EDE4</text><rect x="912" y="1450" width="190" height="115" fill="#B59B8A" stroke="#B59B8A"/><text x="912" y="1600" fill="#6E0F2A" font-family="Segoe UI, sans-serif" font-size="19" letter-spacing="0">#B59B8A</text><text x="80" y="1690" fill="#6E0F2A" font-family="Segoe UI, sans-serif" font-size="18" letter-spacing="0">Símbolo redesenhado em curvas Bézier limpas; texto composto com fonte.</text><text x="80" y="1724" fill="#6E0F2A" font-family="Segoe UI, sans-serif" font-size="18" letter-spacing="0">Referência: Identidade de Luxo VeronaFood.png.</text></svg>